<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Official Store Produk Unggulan</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- STICKY NAVBAR DENGAN LOGO 1:1 -->
    <header class="navbar">
        <div class="brand-box">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=150&auto=format&fit=crop&q=80" alt="Logo Brand" class="brand-logo">
            <span class="brand-name">AeroStyle</span>
        </div>
        <nav class="nav-links">
            <a href="#promo">Promo</a>
            <a href="#terlaris">Terlaris</a>
            <a href="#koleksi">Koleksi</a>
            <a href="#prestasi">Prestasi</a>
            <a href="#order" class="btn-nav">Beli Sekarang</a>
        </nav>
    </header>

    <main>
        <!-- SECTION 1: IMAGE CAROUSEL (PURE CSS SCROLL-SNAP) -->
        <section id="promo" class="carousel-container">
            <div class="carousel-slide">
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?w=1200&auto=format&fit=crop&q=80" alt="Promo 1">
                    <div class="carousel-caption">Koleksi Musim Baru 2026</div>
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1511556532299-8f662fc26c06?w=1200&auto=format&fit=crop&q=80" alt="Promo 2">
                    <div class="carousel-caption">Diskon Terbesar Pekan Ini</div>
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1460353581641-37babbab0fa6?w=1200&auto=format&fit=crop&q=80" alt="Promo 3">
                    <div class="carousel-caption">Kualitas Bahan Premium</div>
                </div>
            </div>
        </section>

        <!-- SECTION 2: PRODUK TERLARIS -->
        <section id="terlaris" class="section">
            <div class="container">
                <h2 class="section-title">Produk Terlaris Minggu Ini</h2>
                <div class="bestseller-card">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=80" alt="Produk Terlaris" class="bestseller-img">
                    <div class="bestseller-info">
                        <span class="badge">#1 Best Seller</span>
                        <h3>Aero Runner X-1 Series</h3>
                        <p class="price">Rp 599.000</p>
                        <p class="desc">Dirancang dengan bantalan responsif tingkat tinggi untuk kenyamanan maksimal sehari-hari.</p>
                        <a href="#order
